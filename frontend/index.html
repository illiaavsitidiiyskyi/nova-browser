<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Browser</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="toolbar">
            <div class="toolbar-group">
                <button id="btn-back" class="toolbar-btn" title="Back">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-forward" class="toolbar-btn" title="Forward">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M10 6L8.59 7.41 12.17 11l-3.58 3.59L10 16l6-6z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-reload" class="toolbar-btn" title="Reload">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-home" class="toolbar-btn" title="Home">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
                    </svg>
                </button>
            </div>

            <div class="address-bar-container">
                <input 
                    type="text" 
                    id="address-bar" 
                    class="address-bar" 
                    placeholder="Enter URL..."
                    value="https://example.com"
                >
            </div>

            <div class="toolbar-group">
                <button id="btn-menu" class="toolbar-btn" title="Menu">
                    <svg viewBox="0 0 24 24" width="16" height="16">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="tabs-bar">
            <div id="tabs-container" class="tabs-container">
                <div class="tab active" data-tab-id="1">
                    <span class="tab-title">New Tab</span>
                    <button class="tab-close">×</button>
                </div>
            </div>
            <button id="btn-new-tab" class="btn-new-tab">+</button>
        </div>

        <div class="browser-container">
    <main class="content">
        <div id="webview" class="webview">
            <div class="placeholder">
                <h2>Nova Browser</h2>
                <p>Enter a URL in the address bar to navigate.</p>
            </div>
        </div>
    </main>

    <aside class="sidebar">
        <div class="sidebar-title">⭐ Favorites</div>
        <button id="btn-add-favorite" class="btn-add-fav">Add</button>
        <div id="favorites-list" class="favorites-list"></div>
    </aside>
</div>

    <script src="js/ipc-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
