<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Browser</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <header class="toolbar">
            <div class="toolbar-group">
                <button id="btn-back" class="toolbar-btn" title="Back">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-forward" class="toolbar-btn" title="Forward">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M10 6L8.59 7.41 12.17 11l-3.58 3.59L10 16l6-6z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-reload" class="toolbar-btn" title="Reload">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-home" class="toolbar-btn" title="Home">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" fill="currentColor"/>
                    </svg>
                </button>
            </div>

            <div class="address-bar-container">
                <input 
                    type="text" 
                    id="address-bar" 
                    class="address-bar" 
                    placeholder="Enter URL..."
                    value="https://example.com"
                >
            </div>

            <div class="toolbar-group">
                <button id="btn-theme-toggle" class="toolbar-btn" title="Toggle theme">
                    <span id="theme-icon">🌙</span>
                </button>
                <button id="btn-settings" class="toolbar-btn" title="Settings">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.62l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.09-.47 0-.59.22L2.74 8.87c-.12.21-.08.48.1.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.1.62l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.47 0 .59-.22l1.92-3.32c.12-.22.07-.48-.12-.62l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" fill="currentColor"/>
                    </svg>
                </button>
                <button id="btn-menu" class="toolbar-btn" title="Menu">
                    <svg viewBox="0 0 24 24" width="18" height="18">
                        <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" fill="currentColor"/>
                    </svg>
                </button>
            </div>
        </header>

        <div class="tabs-bar">
            <div id="tabs-container" class="tabs-container">
                <div class="tab active" data-tab-id="1">
                    <span class="tab-title">New Tab</span>
                    <button class="tab-close">×</button>
                </div>
            </div>
            <button id="btn-new-tab" class="btn-new-tab">+</button>
        </div>

        <div class="browser-container">
            <aside class="sidebar sidebar-left">
                <div class="sidebar-title">📜 History</div>
                <input type="text" id="search-history" class="sidebar-search" placeholder="Search history...">
                <button id="btn-clear-history" class="btn-clear-history">Clear</button>
                <div id="history-list" class="history-list"></div>
            </aside>

            <main class="content">
                <div id="webview" class="webview">
                    <div class="placeholder">
                        <h2>Nova Browser</h2>
                        <p>Enter a URL in the address bar to navigate.</p>
                    </div>
                </div>
            </main>

            <aside class="sidebar sidebar-right">
                <div class="sidebar-title">⭐ Favorites</div>
                <input type="text" id="search-favorites" class="sidebar-search" placeholder="Search favorites...">
                <button id="btn-add-favorite" class="btn-add-fav">Add</button>
                <div id="favorites-list" class="favorites-list"></div>
            </aside>
        </div>
    </div>

    <div id="settings-modal" class="settings-modal" style="display: none;">
        <div class="settings-dialog">
            <div class="settings-header">
                <h2>Settings</h2>
                <button id="btn-close-settings" class="btn-close-settings">×</button>
            </div>
            <div class="settings-content">
                <div class="settings-group">
                    <label for="zoom-slider">Zoom Level:</label>
                    <div class="zoom-control">
                        <span id="zoom-value">100%</span>
                        <input type="range" id="zoom-slider" min="50" max="200" value="100" step="10">
                    </div>
                </div>
                <div class="settings-group">
                    <label for="home-page-input">Home Page URL:</label>
                    <input type="text" id="home-page-input" class="settings-input" placeholder="https://example.com" value="https://example.com">
                </div>
                <div class="settings-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="privacy-do-not-track" class="settings-checkbox">
                        <span>Enable "Do Not Track"</span>
                    </label>
                </div>
                <div class="settings-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="privacy-block-cookies" class="settings-checkbox">
                        <span>Block Third-Party Cookies</span>
                    </label>
                </div>
                <div class="settings-actions">
                    <button id="btn-save-settings" class="btn-save-settings">Save Settings</button>
                    <button id="btn-reset-settings" class="btn-reset-settings">Reset to Default</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ipc-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
